<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Staff Attendance Management GPS based HRM App</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- URL Parameters Pass Karne Ke Liye Script -->
  <script>
    window.onload = function() {
      var queryParams = window.location.search;
      var appsScriptUrl = "https://script.google.com/macros/s/AKfycbxQy-ni-SMd2XlVJzlz-eBLtYZzbXuzAk7D-hQmV4-D2Dk9W4v5Rfw-gm85HLsf0Icp9A/exec";
      document.getElementById("appFrame").src = appsScriptUrl + queryParams;
    };
  </script>

  <!-- Dynamic iFrame -->
  <iframe id="appFrame" src="" style="width:100%; height:100%; border:none;"></iframe>

</body>
</html>
